name: Lint code

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    permissions:
      pull-requests: read
    with:
      filter-group: build

  lint-qml:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/shell-arch-env:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: CMake build
        run: |
          # Set version and git rev for CI build so we don't call git
          cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=clazy -DVERSION= -DGIT_REVISION=
          cmake --build build

      - name: Lint QML
        shell: bash
        run: |
          /usr/lib/qt6/bin/qmllint --version

          # Generate tooling
          touch .qmlls.ini
          QT_QPA_PLATFORM=offscreen QML2_IMPORT_PATH="$PWD/build/qml:$QML2_IMPORT_PATH" timeout 2 qs -p .

          # Construct linter args
          build_dir=$(grep -oP '(?<=buildDir=")(.*)(?=")' .qmlls.ini || true)
          import_paths_raw=$(grep -oP '(?<=importPaths=")(.*)(?=")' .qmlls.ini || true)
          IFS=: read -ra import_paths <<< "$import_paths_raw"
          args=(-I "$build_dir")
          for path in "${import_paths[@]}"; do
            args+=(-I "$path")
          done

          shopt -s globstar nullglob
          qml_files=()
          for file in **/*.qml; do
            if [[ "$file" != build/* ]]; then
              qml_files+=("$file")
            fi
          done

          # Lint
          lint_out=$(mktemp)
          /usr/lib/qt6/bin/qmllint "${args[@]}" "${qml_files[@]}" 2> "$lint_out"

          singleton_pattern='Type [A-Z][a-zA-Z0-9]* not declared as singleton in qmldir but using pragma Singleton'
          post_reload_hook_pattern='PostReloadHook was not found\. Did you add all imports and dependencies\?'
          sed -i -E "/(($singleton_pattern)|($post_reload_hook_pattern)) \[import\]/d" "$lint_out"

          cat "$lint_out"

          ! test -s "$lint_out"

  lint-cpp:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/shell-arch-env:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: CMake build
        run: |
          cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -DVERSION= -DGIT_REVISION=

      - name: Lint C++
        run: |
          clang-tidy --version
          run-clang-tidy -p build -quiet -j "$(nproc)" -warnings-as-errors='*' \
            -source-filter='^(?!.*/build/).*\.cpp$'

  lint-check:
    if: always()
    needs:
      - changes
      - lint-qml
      - lint-cpp
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify lint results
        uses: $/.github/actions/verify-checks
        with:
          needs: ${{ toJSON(needs) }}
          checks: |
            {
              "lint-qml": "lint",
              "lint-cpp": "lint"
            }
